---
# Template for a Sun Kafka service.
# Copy this file, replace all occurrences of MY-SVC with your service name,
# and set the image name.
#
# Rolling deploy contract:
#   maxUnavailable: 0  — old pods stay up until new pods pass readiness
#   maxSurge: 1        — one extra pod during the rollout window
#
# Schema safety contract:
#   Before deploying a schema change, run: platform/local/scripts/check-schemas.sh
#   A breaking change returns exit 1 and blocks the deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: MY-SVC
  namespace: sun
  labels:
    app: MY-SVC
    app.kubernetes.io/part-of: sun
spec:
  replicas: 2   # at least 2 for rolling updates to make sense
  selector:
    matchLabels:
      app: MY-SVC
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: MY-SVC
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redpanda 9092; do
                echo "waiting for kafka..."; sleep 2
              done
        - name: wait-for-schema-registry
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://redpanda:8081/subjects; do
                echo "waiting for schema registry..."; sleep 2
              done
      containers:
        - name: MY-SVC
          image: MY-SVC:latest
          imagePullPolicy: Always
          env:
            - name: KAFKA_BROKERS
              value: "redpanda.sun.svc.cluster.local:9092"
            - name: SCHEMA_REGISTRY_URL
              value: "http://redpanda.sun.svc.cluster.local:8081"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Add a readinessProbe here if your service exposes an HTTP health endpoint.
          # Kafka consumers that don't serve HTTP can omit this — K8s treats a
          # running process as ready by default.
          # readinessProbe:
          #   httpGet:
          #     path: /healthz
          #     port: 8080
          #   initialDelaySeconds: 5
          #   periodSeconds: 10
