---
# Sun demo app deployment.
# Build the image first: docker build -t sun-demo:local -f platform/local/Dockerfile .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sun-demo
  namespace: sun
  labels:
    app: sun-demo
    app.kubernetes.io/part-of: sun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sun-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # bring up 1 new pod before removing the old one
      maxUnavailable: 0  # never take down an old pod until the new one is ready
  template:
    metadata:
      labels:
        app: sun-demo
    spec:
      initContainers:
        # Wait for Redpanda to accept Kafka connections before starting the app.
        # Without this, the app may fail to connect and crash-loop on first deploy.
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redpanda kafka..."
              until nc -z redpanda 9092; do sleep 2; done
              echo "Redpanda kafka ready."
        - name: wait-for-schema-registry
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for schema registry..."
              until wget -q -O /dev/null http://redpanda:8081/subjects; do sleep 2; done
              echo "Schema registry ready."
      containers:
        - name: sun-demo
          image: sun-demo:local
          imagePullPolicy: Never   # use local image in k3s
          env:
            - name: KAFKA_BROKERS
              value: "redpanda.sun.svc.cluster.local:9092"
            - name: SCHEMA_REGISTRY_URL
              value: "http://redpanda.sun.svc.cluster.local:8081"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
