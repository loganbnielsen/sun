# GitHub Actions workflow for Sun workspaces — direct deploy mode.
#
# Copy this file to your workspace repo at .github/workflows/deploy.yml
# and set the repository secrets listed below.
#
# Required secrets:
#   AWS_ACCESS_KEY_ID         — IAM user with ECR push + EKS deploy permissions
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION                — e.g. us-east-1
#   ECR_REGISTRY              — from `terraform output ecr_registry` in platform/infra/aws
#   KUBECONFIG_B64            — base64-encoded kubeconfig: $(cat ~/.kube/config | base64)
#
# Optional secrets (override cluster defaults):
#   POSTGRES_URL              — set when using RDS instead of in-cluster postgres
#
# For GitOps mode (Argo CD), see github-actions-gitops.yml instead.

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── OCaml / opam setup ────────────────────────────────────────────── #
      - uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: "5.4"
          opam-depext: false

      - name: Install system deps
        run: sudo apt-get install -y librdkafka-dev libpq-dev

      - name: Install OCaml packages
        run: |
          opam install . --deps-only --with-test -y
          eval $(opam env)
          dune build

      # ── Docker / ECR ──────────────────────────────────────────────────── #
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build and push images
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          SHA:      ${{ github.sha }}
          WORKSPACE: ${{ github.event.repository.name }}
        run: |
          SHORT_SHA=${SHA::7}
          find app -name Dockerfile | while read dockerfile; do
            dir=$(dirname "$dockerfile")
            svc=$(basename "$dir" | tr '_' '-')
            domain=$(basename $(dirname "$dir"))
            image="${REGISTRY}/${WORKSPACE}/${svc}:${SHORT_SHA}"
            echo "Building $image"
            docker build -t "$image" -f "$dockerfile" .
            docker push "$image"
          done

      # ── Deploy ────────────────────────────────────────────────────────── #
      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config

      - name: sun deploy
        env:
          SHA:      ${{ github.sha }}
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          eval $(opam env)
          SHORT_SHA=${SHA::7}
          sun deploy \
            --image-tag "$SHORT_SHA" \
            --registry  "$REGISTRY"

      - name: sun status
        run: |
          eval $(opam env)
          sun status
