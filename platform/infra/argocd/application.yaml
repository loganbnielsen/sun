# Argo CD Application — apply once to the cluster after platform/infra/base/ is up.
# Replace GITOPS_REPO_URL and WORKSPACE_NAME with your values.
#
#   kubectl apply -f platform/infra/argocd/application.yaml
#
# After this, Argo CD watches the GitOps repo and reconciles the cluster
# whenever `sun deploy --emit-to` pushes new manifests.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: WORKSPACE_NAME
  namespace: argocd
  # Cascade deletion: removing this Application also removes all deployed resources.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: GITOPS_REPO_URL        # e.g. https://github.com/myorg/acme-gitops
    targetRevision: main
    path: .                         # manifests are at repo root

  destination:
    server: https://kubernetes.default.svc
    # sun deploy writes per-namespace manifests; Argo CD applies them cluster-wide
    namespace: default

  syncPolicy:
    automated:
      prune:    true   # remove resources deleted from the GitOps repo
      selfHeal: true   # revert manual kubectl changes
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
