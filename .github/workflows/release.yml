name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get install -y librdkafka-dev libpq-dev libpq5

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1

      - name: Pin extracted opam packages
        run: |
          # Tracking #main on every support package during active parallel
          # development across all of them — sun should build against their
          # latest code, not a tag that's fallen behind. Revert to tagged
          # pins once these settle and cut real releases (re-running a past
          # sun release build later can then pull in different dependency
          # code than what originally shipped — accepted tradeoff for now).
          opam pin add kafka-eio https://github.com/loganbnielsen/kafka-eio.git#main -y
          opam pin add obs-eio https://github.com/loganbnielsen/obs-eio.git#main -y
          opam pin add obs-loki-eio https://github.com/loganbnielsen/obs-loki-eio.git#main -y
          opam pin add obs-prometheus-eio https://github.com/loganbnielsen/obs-prometheus-eio.git#main -y
          opam pin add pg-eio https://github.com/loganbnielsen/pg-eio.git#main -y
          opam pin add aws-eio https://github.com/loganbnielsen/aws-eio.git#main -y
          opam pin add s3-eio https://github.com/loganbnielsen/s3-eio.git#main -y
          opam pin add dynamodb-eio https://github.com/loganbnielsen/dynamodb-eio.git#main -y
          opam pin add lambda-eio https://github.com/loganbnielsen/lambda-eio.git#main -y

      - name: Install OCaml dependencies
        run: opam install . --deps-only -y

      - name: Build sun binary
        run: opam exec -- dune build cli/sun/bin/main.exe

      - name: Stage artifact
        run: |
          VERSION="${{ github.ref_name }}"
          BUNDLE="sun-${VERSION}-linux-x86_64"
          mkdir -p dist/${BUNDLE}/bin
          cp _build/default/cli/sun/bin/main.exe dist/${BUNDLE}/bin/sun
          chmod +x dist/${BUNDLE}/bin/sun
          cp -r framework dist/${BUNDLE}/framework
          cp -r integrations dist/${BUNDLE}/integrations
          cd dist
          tar czf ${BUNDLE}.tar.gz ${BUNDLE}
          # Also keep the standalone binary for scripted installs
          cp ${BUNDLE}/bin/sun sun-linux-x86_64

      - name: Smoke test release bundle
        run: |
          set -e
          VERSION="${{ github.ref_name }}"
          BUNDLE="dist/sun-${VERSION}-linux-x86_64"
          # Binary should start and show help without framework resolution errors
          ${BUNDLE}/bin/sun --help > /dev/null
          # Verify framework source exists at expected location in bundle
          test -f ${BUNDLE}/framework/sun-svc/lib/dune
          test -f ${BUNDLE}/integrations/kafka/kafka-eio-service/lib/dune
          echo "Bundle structure verified"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/sun-linux-x86_64
            dist/sun-*-linux-x86_64.tar.gz
          generate_release_notes: true
