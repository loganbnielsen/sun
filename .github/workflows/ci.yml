name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get install -y librdkafka-dev libpq-dev libpq5

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1

      - name: Pin extracted opam packages
        run: |
          # Tracking #main on every support package during active parallel
          # development across all of them — sun should build against their
          # latest code, not a tag that's fallen behind. Revert to tagged
          # pins once these settle and cut real releases.
          # https-eio first: obs-loki-eio/obs-prometheus-eio/aws-eio all
          # depend on it, and each -y pin below installs immediately --
          # pinning it after them let their own install step pull in the
          # published opam-repository https-eio before this pin ever ran.
          opam pin add https-eio https://github.com/loganbnielsen/https-eio.git#main -y
          opam pin add kafka-eio https://github.com/loganbnielsen/kafka-eio.git#main -y
          opam pin add obs-eio https://github.com/loganbnielsen/obs-eio.git#main -y
          opam pin add obs-loki-eio https://github.com/loganbnielsen/obs-loki-eio.git#main -y
          opam pin add obs-prometheus-eio https://github.com/loganbnielsen/obs-prometheus-eio.git#main -y
          opam pin add pg-eio https://github.com/loganbnielsen/pg-eio.git#main -y
          opam pin add aws-eio https://github.com/loganbnielsen/aws-eio.git#main -y
          opam pin add s3-eio https://github.com/loganbnielsen/s3-eio.git#main -y
          opam pin add dynamodb-eio https://github.com/loganbnielsen/dynamodb-eio.git#main -y
          opam pin add lambda-eio https://github.com/loganbnielsen/lambda-eio.git#main -y

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Unit tests (no broker/Postgres/Loki required)
        run: opam exec -- dune test framework/ cli/sun/test/
